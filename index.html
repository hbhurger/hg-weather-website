<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HG WEATHER</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Sekuya&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Style the top header title */
    .page-title {
      text-align: center;
      padding: 10px;
      margin: 0;
      background-color: #f8f8f8;
      border-bottom: 1px solid #ddd;
      font-family: 'Bitcount Prop Single', sans-serif;
    }

    /* Style the header banner */
    header {
      position: relative;
      width: 100%;
      height: 300px; /* Gives the banner nice breathing room */
      background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('new-york-city-central-park.avif'); 
      background-size: cover; /* Ensures image covers background perfectly */
      background-position: center; /* Keeps image centered */
      display: flex;
      justify-content: center; /* Centers title horizontally */
      align-items: center; /* Centers title vertically */
      text-align: center;
      color: white;
      font-family: 'Sekuya', sans-serif;
    }

    header h2 {
      font-size: 40px; /* Makes the title stand out */
      margin: 0;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7); /* Keeps text legible over the photo */
    }

    /* Layout Columns */
    nav {
      float: left;
      width: 30%;
      min-height: 350px;
      background: #ccc;
      padding: 20px;
      font-family: 'Montserrat', sans-serif;
    }

    nav ul {
      list-style-type: none;
      padding: 0;
    }

    article {
      float: left;
      padding: 20px;
      width: 70%;
      background-color: #f1f1f1;
      min-height: 350px;
      font-family: 'Sekuya', sans-serif;
    }

    /* Clear floats after the columns */
    section::after {
      content: "";
      display: table;
      clear: both;
    }

    /* Weather Form & Elements */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      padding: 10px;
      font-size: 16px;
      flex-grow: 1;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: 'Montserrat', sans-serif;
    }

    .search-box button {
      padding: 10px 15px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Sekuya', sans-serif;
    }

    .search-box button:hover {
      background-color: #45a049;
      font-family: 'Sekuya', sans-serif;
    }

    .weather-display {
      background: white;
      padding: 15px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      font-family: 'Montserrat', sans-serif;
    }

    .weather-header {
      display: flex;
      align-items: center;
      gap: 15px;
      font-family: 'Sekuya', sans-serif;
    }

    .temp {
      font-size: 2rem;
      font-weight: bold;
      font-family: 'Sekuya', sans-serif;
    }

    .error-msg {
      color: #d9534f;
      font-weight: bold;
      font-family: 'Sekuya', sans-serif;
    }

    /* Style the footer */
    footer {
      background-color: #777;
      padding: 10px;
      text-align: center;
      color: white;
      font-family: 'Sekuya', sans-serif;
    }

    /* Responsive layout */
    @media (max-width: 600px) {
      nav, article {
        width: 100%;
        min-height: auto;
      }
    }
  </style>
</head>
<body>

<a href="https://github.io" style="text-decoration: none; color: inherit;">
  <h1 class="page-title">HG WEATHER</h1>
</a>


<header>
  <h2>Live Weather Lookup</h2>
</header>

<section>  
  <nav>
    <h3>Popular Cities</h3>
    <ul>
      <li><a href="#" onclick="fetchWeather('London'); return false;">London</a></li>
      <li><a href="#" onclick="fetchWeather('New York'); return false;">New York</a></li>
      <li><a href="#" onclick="fetchWeather('Tokyo'); return false;">Tokyo</a></li>
      <li><a href="#" onclick="fetchWeather('Sydney'); return false;">Sydney</a></li>
    </ul>
  </nav>

  <article>
    <h2>Enter your location:</h2>
    
    <form class="search-box" id="weather-form">
      <input type="text" id="location-input" placeholder="City name, zip code, or lat/lon..." required>
      <button type="submit">Search</button>
    </form>

    <div id="weather-result">
      <!-- Weather data will render here -->
    </div>
  </article>
</section>

<footer>
  <p>Made by Hugh, with love.</p>
  <p>Powered by Free Weather API, WeatherAPI.com.</p>
  <p>© HUGH 2026. ALL RIGHTS RESERVED.</p>
</footer>

<script>
  const API_KEY = '7d8f010532c44b339e633242261008';

  const form = document.getElementById('weather-form');
  const input = document.getElementById('location-input');
  const resultContainer = document.getElementById('weather-result');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const location = input.value.trim();
    if (location) {
      fetchWeather(location);
    }
  });

  async function fetchWeather(locationQuery) {
    resultContainer.innerHTML = '<p>Loading weather...</p>';

    try {
      const response = await fetch(
        `https://api.weatherapi.com/v1/current.json?key=${API_KEY}&q=${encodeURIComponent(locationQuery)}&aqi=no`
      );

      if (!response.ok) {
        throw new Error('Location not found or API issue.');
      }

      const data = await response.json();

      const city = data.location.name;
      const country = data.location.country;
      const tempC = data.current.temp_c;
      const tempF = data.current.temp_f;
      const condition = data.current.condition.text;
      const icon = "https:" + data.current.condition.icon;
      const humidity = data.current.humidity;
      const windKph = data.current.wind_kph;

      resultContainer.innerHTML = `
        <div class="weather-display">
          <h2>${city}, ${country}</h2>
          <div class="weather-header">
            <img src="${icon}" alt="${condition}">
            <div>
              <div class="temp">${tempC}°C / ${tempF}°F</div>
              <p><strong>${condition}</strong></p>
            </div>
          </div>
          <hr>
          <p><strong>Humidity:</strong> ${humidity}%</p>
          <p><strong>Wind:</strong> ${windKph} km/h</p>
        </div>
      `;
    } catch (error) {
      resultContainer.innerHTML = `<p class="error-msg">Error: ${error.message}</p>`;
    }
  }
</script>

</body>
</html>

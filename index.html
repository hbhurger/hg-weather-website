<!DOCTYPE html>
<html lang="en">
<head>
<title>HG WEATHER</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  margin: 0;
  padding: 0;
}

/* Style the top header title */
.page-title {
  text-align: center;
  padding: 10px;
  margin: 0;
  background-color: #f8f8f8;
  border-bottom: 1px solid #ddd;
}

/* Style the header banner */
header {
  background-color: #666;
  padding: 30px;
  text-align: center;
  font-size: 25px;
  color: white;
}

/* Layout Columns */
nav {
  float: left;
  width: 30%;
  min-height: 350px;
  background: #ccc;
  padding: 20px;
}

nav ul {
  list-style-type: none;
  padding: 0;
}

article {
  float: left;
  padding: 20px;
  width: 70%;
  background-color: #f1f1f1;
  min-height: 350px;
}

/* Clear floats after the columns */
section::after {
  content: "";
  display: table;
  clear: both;
}

/* Weather Form & Elements */
.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.search-box input {
  padding: 10px;
  font-size: 16px;
  flex-grow: 1;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.search-box button {
  padding: 10px 15px;
  font-size: 16px;
  background-color: #4CAF50;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.search-box button:hover {
  background-color: #45a049;
}

.weather-display {
  background: white;
  padding: 15px;
  border-radius: 6px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.weather-header {
  display: flex;
  align-items: center;
  gap: 15px;
}

.temp {
  font-size: 2rem;
  font-weight: bold;
}

.error-msg {
  color: #d9534f;
  font-weight: bold;
}

/* Style the footer */
footer {
  background-color: #777;
  padding: 10px;
  text-align: center;
  color: white;
}

/* Responsive layout */
@media (max-width: 600px) {
  nav, article {
    width: 100%;
    min-height: auto;
  }
}
</style>
</head>
<body>

<h2 class="page-title">HG WEATHER</h2>

<header>
  <h2>Live Weather Lookup</h2>
</header>

<section>  
  <nav>
    <h3>Popular Cities</h3>
    <ul>
      <li><a href="#" onclick="fetchWeather('London'); return false;">London</a></li>
      <li><a href="#" onclick="fetchWeather('New York'); return false;">New York</a></li>
      <li><a href="#" onclick="fetchWeather('Tokyo'); return false;">Tokyo</a></li>
      <li><a href="#" onclick="fetchWeather('Sydney'); return false;">Sydney</a></li>
    </ul>
  </nav>

  <article>
    <h1>Enter your location:</h1>
    
    <form class="search-box" id="weather-form">
      <input type="text" id="location-input" placeholder="City name, zip code, or lat/lon..." required>
      <button type="submit">Search</button>
    </form>

    <div id="weather-result">
      <!-- Weather data will render here -->
    </div>
  </article>
</section>

<footer>
  <p>Made by Hugh, with love.</p>
</footer>

<script>
  const API_KEY = 'YOUR_API_KEY'; // Replace with your actual WeatherAPI key

  const form = document.getElementById('weather-form');
  const input = document.getElementById('location-input');
  const resultContainer = document.getElementById('weather-result');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const location = input.value.trim();
    if (location) {
      fetchWeather(location);
    }
  });

  async function fetchWeather(locationQuery) {
    resultContainer.innerHTML = '<p>Loading weather...</p>';

    try {
      const response = await fetch(
        `https://api.weatherapi.com/v1/current.json?key=${API_KEY}&q=${encodeURIComponent(locationQuery)}&aqi=no`
      );

      if (!response.ok) {
        throw new Error('Location not found or API issue.');
      }

      const data = await response.json();

      // Extract fields from API payload
      const city = data.location.name;
      const country = data.location.country;
      const tempC = data.current.temp_c;
      const tempF = data.current.temp_f;
      const condition = data.current.condition.text;
      const icon = "https:" + data.current.condition.icon;
      const humidity = data.current.humidity;
      const windKph = data.current.wind_kph;

      // Output content to the page
      resultContainer.innerHTML = `
        <div class="weather-display">
          <h2>${city}, ${country}</h2>
          <div class="weather-header">
            <img src="${icon}" alt="${condition}">
            <div>
              <div class="temp">${tempC}°C / ${tempF}°F</div>
              <p><strong>${condition}</strong></p>
            </div>
          </div>
          <hr>
          <p><strong>Humidity:</strong> ${humidity}%</p>
          <p><strong>Wind:</strong> ${windKph} km/h</p>
        </div>
      `;
    } catch (error) {
      resultContainer.innerHTML = `<p class="error-msg">Error: ${error.message}</p>`;
    }
  }
</script>

</body>
</html>
